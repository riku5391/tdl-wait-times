<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243b"><title>TDL 待ち時間</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#15243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#10243b;color:white;padding:22px 16px 16px}h1{font-size:23px;margin:0 0 6px}.sub{font-size:12px;color:#c6d6ea}main{max-width:760px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select,button,input{font:inherit;border:1px solid #d5dfeb;border-radius:10px;padding:10px;background:white}button{cursor:pointer}.active{background:#176ad2;color:white}#status{font-size:13px;color:#52677f;margin:10px 0 15px}.ride{background:white;border-radius:14px;padding:14px;margin:9px 0;display:flex;align-items:center;gap:12px;box-shadow:0 2px 9px #10243b0c}.details{flex:1;min-width:0}.name{font-weight:700}.area{font-size:12px;color:#6b7d90;margin-top:4px}.wait{font-size:25px;font-weight:800;color:#1262bc;text-align:right;white-space:nowrap}.wait small{font-size:12px}.closed{font-size:14px;color:#7a8593}.star{font-size:24px;border:0;padding:4px;color:#a4b0bf}.star.on{color:#efaa21}.empty{padding:30px;text-align:center;color:#687b90}.foot{font-size:12px;color:#65788d;margin:20px 3px;line-height:1.6}</style></head><body><header><h1>🏰 東京ディズニーランド 待ち時間</h1><div class="sub">個人用ビューア ・ 画面は1分ごとに確認</div></header><main><div class="toolbar"><input id="search" placeholder="アトラクションを検索" aria-label="検索" style="flex:1;min-width:140px"><select id="sort" aria-label="並び順"><option value="short">短い順</option><option value="long">長い順</option><option value="name">名前順</option></select><select id="area" aria-label="エリア"><option value="">全エリア</option></select><button id="fav">☆ お気に入り</button><button id="reload">↻ 更新</button></div><div id="status" role="status">データを取得しています…</div><div id="rides"></div><p class="foot">データ提供: <a href="https://themeparks.wiki/" target="_blank" rel="noopener">ThemeParks.wiki</a>。非公式アプリです。情報は遅延・欠落する場合があります。実際の運営状況は東京ディズニーリゾート公式アプリで確認してください。</p></main><script>
const JP_NAMES={
"Big Thunder Mountain":"ビッグサンダー・マウンテン",
"Space Mountain":"スペース・マウンテン",
"Splash Mountain":"スプラッシュ・マウンテン",
"Enchanted Tale of Beauty and the Beast":"美女と野獣“魔法のものがたり”",
"Pooh's Hunny Hunt":"プーさんのハニーハント",
"Monsters, Inc. Ride & Go Seek!":"モンスターズ・インク“ライド＆ゴーシーク！”",
"Haunted Mansion":"ホーンテッドマンション",
"Pirates of the Caribbean":"カリブの海賊",
"Jungle Cruise: Wildlife Expeditions":"ジャングルクルーズ",
"Western River Railroad":"ウエスタンリバー鉄道",
"Peter Pan's Flight":"ピーターパン空の旅",
"it's a small world":"イッツ・ア・スモールワールド",
"Buzz Lightyear's Astro Blasters":"バズ・ライトイヤーのアストロブラスター",
"Star Tours – The Adventures Continue":"スター・ツアーズ",
"Roger Rabbit's Car Toon Spin":"ロジャーラビットのカートゥーンスピン",
"Beaver Brothers Explorer Canoes":"ビーバーブラザーズのカヌー探険",
"Country Bear Theater":"カントリーベア・シアター",
"Mickey's PhilharMagic":"ミッキーのフィルハーマジック",
"Castle Carrousel":"キャッスルカルーセル",
"Tom Sawyer Island Rafts":"トムソーヤ島いかだ",
"Donald's Boat":"ドナルドのボート"
};};
Object.assign(JP_NAMES,{const PARK='3cc919f1-d16d-43e0-8c3f-1dd269bd1a42';const BASE='https://api.themeparks.wiki/v1/entity/';let rides=[],onlyFav=false,lastFetch=0;const $=id=>document.getElementById(id);const favs=new Set(JSON.parse(localStorage.getItem('tdl-favs')||'[]'));function status(s){$('status').textContent=s}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.trim().toLowerCase(),a=$('area').value;let list=rides.filter(r=>(!onlyFav||favs.has(r.id))&&(!a||r.area===a)&&r.name.toLowerCase().includes(q));let val=r=>r.wait===null?9999:r.wait;list.sort((a,b)=>$('sort').value==='name'?a.name.localeCompare(b.name,'ja'):$('sort').value==='long'?val(b)-val(a):val(a)-val(b));$('rides').innerHTML=list.length?list.map(r=>`<article class="ride"><button class="star ${favs.has(r.id)?'on':''}" data-id="${esc(r.id)}" aria-label="お気に入り">${favs.has(r.id)?'★':'☆'}</button><div class="details"><div class="name">${esc(r.name)}</div><div class="area">${esc(r.area||'エリア不明')}</div></div><div class="wait ${r.wait===null?'closed':''}">${r.wait===null?esc(r.status):`${r.wait}<small> 分</small>`}</div></article>`).join(''):'<div class="empty">該当するアトラクションがありません。</div>'}function fillAreas(){let current=$('area').value;let areas=[...new Set(rides.map(r=>r.area).filter(Boolean))].sort();$('area').innerHTML='<option value="">全エリア</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');$('area').value=areas.includes(current)?current:''}async function load(force=false){if(!force&&Date.now()-lastFetch<5*60*1000)return;status('最新データを取得中…');try{let res=await fetch(BASE+PARK+'/live');if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();let live=data.liveData||[];rides=live.filter(x=>x.entityType==='ATTRACTION').map(x=>{let st=x.queue?.STANDBY;let wait=typeof st?.waitTime==='number'?st.waitTime:null;return{id:x.id,name:JP_NAMES[x.name]||x.name||'名称不明',area:x.area?.name||'',wait,status:x.status==='OPERATING'?'待ち時間未掲載':x.status==='DOWN'?'一時休止':x.status==='CLOSED'?'運営終了':x.status==='REFURBISHMENT'?'休止中':'情報なし'}});lastFetch=Date.now();fillAreas();render();status(`取得成功：${new Date().toLocaleTimeString('ja-JP')} ・ ${rides.length}件（データ元の更新頻度は別）`)}catch(e){status('データ取得に失敗しました。通信状況やAPIの利用可否をご確認ください。 '+e.message);if(!rides.length)$('rides').innerHTML='<div class="empty">現在、待ち時間を表示できません。</div>'}}$('rides').addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(!b)return;let id=b.dataset.id;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('tdl-favs',JSON.stringify([...favs]));render()});['search','sort','area'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('fav').onclick=()=>{onlyFav=!onlyFav;$('fav').classList.toggle('active',onlyFav);render()};$('reload').onclick=()=>load(true);load();setInterval(()=>load(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
