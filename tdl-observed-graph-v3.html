<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TDL 実測混雑比較 v3</title><style>*{box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#eef7ff;color:#17334d;margin:0}main{max-width:720px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #1231}h1{font-size:22px}h2{font-size:18px}.muted{font-size:13px;color:#5c7287;line-height:1.8}.notice{background:#fff2d5;padding:14px;border-radius:12px;line-height:1.7}.big{font-size:30px;font-weight:700;color:#176b9f}.bars{display:flex;align-items:end;gap:5px;height:175px;border-bottom:1px solid #aac;margin:25px 0 35px}.bar{flex:1;background:#4296d0;border-radius:5px 5px 0 0;position:relative;min-width:0}.bar span{position:absolute;top:100%;padding-top:5px;font-size:10px;white-space:nowrap;left:0}button{background:#fff;border:1px solid #b9cfe1;color:#176b9f;padding:10px;border-radius:10px;font-size:15px;margin:2px}.active{background:#176b9f;color:white}</style></head><body><main><h1>📊 東京ディズニーランド 混雑比較</h1><p class="notice">実際に取得した待ち時間のみ表示します。手入力・仮の来園者数・架空のデータは一切ありません。</p><section class="card"><h2>最新の平均待ち時間</h2><div class="big" id="latest">—</div><p class="muted" id="status">準備中…</p><button id="retry">今すぐ再取得</button></section><section class="card"><h2>日別の待ち時間比較</h2><button data-days="7" class="active">7日</button><button data-days="30">30日</button><button data-days="90">90日</button><div class="bars" id="bars"></div><p class="muted" id="info"></p></section><section class="card"><h2>記録方法</h2><p class="muted">このページを開いている間、約1分ごとにThemeParks.wikiから取得します。営業中で数値のあるアトラクションの平均値のみを記録します。日別の値は取得した時刻の平均であり、全営業時間の平均とは限りません。アプリを閉じた時間帯や過去の未取得日は補完しません。</p><button id="csv">記録をCSVで保存</button><p class="muted">記録はiPhoneのブラウザ内に保存されます。Safariのデータ削除などで消える場合があります。</p></section></main><script>
(function(){'use strict';
var park='3cc919f1-d16d-43e0-8c3f-1dd269bd1a42',key='tdl-observed-v1',days=7,items=[];
var latest=document.getElementById('latest'),status=document.getElementById('status'),bars=document.getElementById('bars'),info=document.getElementById('info');
function date(t){var p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(t)),o={};p.forEach(function(x){o[x.type]=x.value});return o.year+'-'+o.month+'-'+o.day}
try{var s=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(s))items=s.filter(function(x){return x&&Number.isFinite(x.t)&&Number.isFinite(x.avg)})}catch(e){status.textContent='保存データを読めません: '+e.message}
function draw(){try{var g={};items.forEach(function(x){var d=date(x.t);if(!g[d])g[d]=[];g[d].push(x.avg)});var dates=[],v=[];for(var i=days-1;i>=0;i--){var d=date(Date.now()-i*86400000),a=g[d];dates.push(d);v.push(a&&a.length?a.reduce(function(x,y){return x+y},0)/a.length:null)}var good=v.filter(function(x){return x!==null}),max=Math.max.apply(null,[60].concat(good));bars.innerHTML='';v.forEach(function(x,i){var b=document.createElement('div');b.className='bar';b.style.height=x===null?'0px':Math.max(2,140*x/max)+'px';b.style.background=x===null?'transparent':'#4296d0';b.title=dates[i]+' '+(x===null?'記録なし':x.toFixed(1)+'分');var l=document.createElement('span');l.textContent=days===7||i%(days===30?5:15)===0?dates[i].slice(5):'';b.appendChild(l);bars.appendChild(b)});info.textContent=good.length+'日分の記録あり。未取得日は空欄です。'}catch(e){info.textContent='グラフ表示エラー: '+e.message}}
var busy=false;async function update(){if(busy)return;busy=true;status.textContent='APIに接続しています…';try{var c=new AbortController(),timer=setTimeout(function(){c.abort()},15000),r;try{r=await fetch('https://api.themeparks.wiki/v1/entity/'+park+'/live',{cache:'no-store',signal:c.signal})}finally{clearTimeout(timer)}if(!r.ok)throw Error('HTTP '+r.status);var j=await r.json();if(!Array.isArray(j.liveData))throw Error('liveDataがありません');var a=j.liveData.filter(function(x){return x.entityType==='ATTRACTION'&&x.status==='OPERATING'}).map(function(x){return x.queue&&x.queue.STANDBY&&x.queue.STANDBY.waitTime}).filter(function(x){return typeof x==='number'&&Number.isFinite(x)&&x>=0});if(!a.length)throw Error('有効な待ち時間なし（閉園中の可能性）');var avg=a.reduce(function(x,y){return x+y},0)/a.length,t=Date.now();items.push({t:t,avg:avg,n:a.length});items=items.filter(function(x){return x.t>t-400*86400000});try{localStorage.setItem(key,JSON.stringify(items))}catch(e){}latest.textContent=avg.toFixed(1)+'分';status.textContent=a.length+'施設・'+new Date(t).toLocaleTimeString('ja-JP')+'取得';draw()}catch(e){status.textContent='取得できません：'+(e.name==='AbortError'?'15秒でタイムアウト':e.message);draw()}finally{busy=false}}
document.querySelectorAll('[data-days]').forEach(function(b){b.addEventListener('click',function(){days=Number(b.getAttribute('data-days'));document.querySelectorAll('[data-days]').forEach(function(x){x.classList.toggle('active',x===b)});draw()})});document.getElementById('retry').addEventListener('click',update);document.getElementById('csv').addEventListener('click',function(){var csv='date,time,average_wait_minutes,attraction_count\n'+items.map(function(x){return date(x.t)+','+new Date(x.t).toISOString()+','+x.avg.toFixed(2)+','+x.n}).join('\n');var a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=u;a.download='tdl-observed.csv';a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)});draw();update();setInterval(update,60000);
})();
</script></body></html>
