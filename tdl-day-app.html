<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#64c7fb"><title>TDL 待ち時間・混雑</title><link rel="icon" href="tdl-day-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="tdl-day-icon.svg"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf8ff}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="app" title="東京ディズニーランド 待ち時間・混雑" src="tdl-unified-app.html"></iframe>
<script>
(function(){
const app=document.getElementById('app');
function styleDoc(doc){if(!doc||doc.getElementById('tdl-day-theme-link'))return;const l=doc.createElement('link');l.id='tdl-day-theme-link';l.rel='stylesheet';l.href=new URL('tdl-day-theme.css',location.href).href;doc.head.appendChild(l);}
function styleGraph(doc){const graph=doc.getElementById('graph-frame');if(!graph)return;graph.addEventListener('load',function(){try{const d=graph.contentDocument;styleDoc(d);if(d&&!d.getElementById('tdl-graph-day-style')){const s=d.createElement('style');s.id='tdl-graph-day-style';s.textContent='body{background:linear-gradient(#d9f3ff,#f7faff)!important}header{background:linear-gradient(135deg,#249ff0,#8ed9ff)!important;border-bottom:4px solid #ffd37b!important} .card{border-radius:20px!important;box-shadow:0 5px 14px #2876b018!important}';d.head.appendChild(s)}}catch(e){}});}
app.addEventListener('load',function(){try{const doc=app.contentDocument;styleDoc(doc);styleGraph(doc)}catch(e){}});
})();
</script></body></html>
