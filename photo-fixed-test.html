<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>東京ディズニーランド 写真付き待ち時間</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;font-family:-apple-system,sans-serif}
iframe{display:block;width:100%;height:100dvh;border:0}
</style>
</head>
<body>
<iframe id="app" src="./index-backup.html" title="東京ディズニーランド待ち時間"></iframe>
<script>
const photos={
'ビッグサンダー・マウンテン':'Tokyo Disneyland Big Thunder Mountain (53441792286).jpg',
'スプラッシュ・マウンテン':'Splash Mountain, Tokyo Disneyland (9409908130).jpg',
'プーさんのハニーハント':"Pooh's Hunny Hunt 1.jpg",
'ホーンテッドマンション':'Haunted Mansion, Tokyo Disneyland (9407212583).jpg',
'ベイマックスのハッピーライド':'Tokyo Disneyland The Happy Ride with Baymax (53440871047).jpg'
};
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;
 if(!doc)return;
 const style=doc.createElement('style');
 style.textContent='.ride-photo{width:78px;height:74px;object-fit:cover;border-radius:10px;display:block;background:#e6ebf2}.photo-link{flex-shrink:0;display:block}.photo-placeholder{width:78px;height:74px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:#e6ebf2;font-size:24px}@media(max-width:390px){.ride{gap:7px;padding:9px}.ride-photo,.photo-placeholder{width:62px;height:64px}.name{font-size:14px}.wait{font-size:20px}}';
 doc.head.appendChild(style);
 const container=doc.getElementById('rides');
 function decorate(){
  for(const card of container.querySelectorAll('.ride')){
   if(card.querySelector('.photo-link,.photo-placeholder'))continue;
   const name=card.querySelector('.name')?.textContent.trim();
   if(!name)continue;
   const file=photos[name];
   let item;
   if(file){
    item=doc.createElement('a');
    item.className='photo-link';
    item.href='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file);
    item.target='_blank';
    item.rel='noopener';
    item.setAttribute('aria-label',name+'の写真の出典');
    const img=doc.createElement('img');
    img.className='ride-photo';
    img.src='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+'?width=320';
    img.alt=name+'の写真';
    img.loading='lazy';
    img.onerror=()=>{
     item.className='photo-placeholder';
     item.removeAttribute('href');
     item.textContent='🏰';
    };
    item.appendChild(img);
   }else{
    item=doc.createElement('div');
    item.className='photo-placeholder';
    item.textContent='🏰';
    item.setAttribute('aria-hidden','true');
   }
   const detail=card.querySelector('.detail');
   if(detail)card.insertBefore(item,detail);
  }
 }
 let busy=false;
 const observer=new MutationObserver(()=>{
  if(busy)return;
  busy=true;
  observer.disconnect();
  decorate();
  observer.observe(container,{childList:true,subtree:true});
  busy=false;
 });
 decorate();
 observer.observe(container,{childList:true,subtree:true});
});
</script>
</body>
</html>
