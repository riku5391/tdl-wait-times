<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TDL通信検証171</title><style>body{font:16px system-ui;background:#17254b;color:#fff3ce;margin:20px;line-height:1.6}button{font:inherit;padding:13px;border-radius:12px;background:#f5d38b;color:#17254b;border:0;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#233462;padding:12px;border-radius:12px}a{color:#ffdc99}</style><h1>🏰 待ち時間・通信検証</h1><p id="env">JavaScript未実行：公開したSafariページでお試しください。</p><button id="go" disabled>通信を確認する</button><button id="copy" disabled>結果をコピー</button><pre id="result">未実行</pre><p>この試験は既存アプリを変更しません。7分未満の提供元時刻を持つデータを数えます。ThemeParks.wikiの時刻は状態変更時刻の可能性があるため、古い時刻のみで通信失敗とは判断しません。アプリ本体の表示は別途確認が必要です。</p><script>function inspect(name,j,now=Date.now()){
 const primary=name==='ThemeParks.wiki';
 if(primary?!Array.isArray(j.liveData):!Array.isArray(j.lands)&&!Array.isArray(j.rides))throw Error('応答形式が不正です');
 const rows=(primary?j.liveData.filter(e=>e.entityType==='ATTRACTION'):[...(j.rides||[]),...(j.lands||[]).flatMap(e=>e.rides||[])]).filter(e=>e.id!=null);
 const counts=new Map();for(const e of rows)counts.set(e.id,(counts.get(e.id)||0)+1);
 let recent=0,old=0,unknown=0,invalid=0,valid=0,zero=0;const stamps=[];
 for(const e of rows){if(counts.get(e.id)>1)continue;const t=Date.parse(primary?e.lastUpdated:e.last_updated);if(!Number.isFinite(t)){unknown++;continue;}if(t>now+120000){invalid++;continue;}stamps.push(t);if(now-t>=420000){old++;continue;}recent++;const w=primary?(e.status==='OPERATING'?e.queue?.STANDBY?.waitTime:null):(e.is_open===true?e.wait_time:null);if(typeof w==='number'&&Number.isFinite(w)&&w>=0&&w<=300){valid++;if(w===0)zero++;}}
 return {count:counts.size,duplicates:[...counts.values()].filter(n=>n>1).length,recent,old,unknown,invalid,valid,zero,latest:stamps.length?new Date(Math.max(...stamps)).toISOString():null};
}
const $=id=>document.getElementById(id),r=$('result');$('env').textContent='JavaScript実行成功 / '+location.protocol+' / '+(navigator.onLine?'オンライン':'オフライン');$('go').disabled=false;
const endpoints=[['ThemeParks.wiki','https://api.themeparks.wiki/v1/entity/3cc919f1-d16d-43e0-8c3f-1dd269bd1a42/live'],['Queue-Times.com','https://queue-times.com/parks/274/queue_times.json']];
$('go').onclick=async()=>{ $('go').disabled=true;$('copy').disabled=true;r.textContent='通信確認中…';try{const lines=await Promise.all(endpoints.map(async([name,url])=>{const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{const x=await fetch(url,{cache:'no-store',signal:c.signal});if(!x.ok)return name+' HTTP '+x.status;const d=inspect(name,await x.json());return name+' HTTP '+x.status+'\n施設 '+d.count+' / 重複 '+d.duplicates+'\n新しい時刻 '+d.recent+' / 古い時刻 '+d.old+' / 不明 '+d.unknown+' / 未来 '+d.invalid+'\n新しい運営中の待ち時間 '+d.valid+'（0分 '+d.zero+'）\n最新提供元時刻 '+(d.latest||'不明');}catch(e){return name+'：'+e.name+' '+e.message;}finally{clearTimeout(timer)}}));r.textContent=new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST\n'+lines.join('\n\n');}finally{$('go').disabled=false;$('copy').disabled=false;}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(r.textContent);$('copy').textContent='コピー済み';}catch(e){const range=document.createRange();range.selectNodeContents(r);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);$('copy').textContent='選択済み：長押しでコピー';}};
</script></html>
