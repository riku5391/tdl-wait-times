<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#15243b;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#10243b;color:#fff;padding:22px 16px}h1{font-size:22px;margin:0 0 8px}small{color:#b9cee4}main{max-width:760px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #d4deeb;border-radius:10px;padding:10px;background:white}input{flex:1;min-width:160px}button{cursor:pointer}.active{background:#176ad2;color:#fff}#status{font-size:13px;color:#52677f;margin:16px 0}.ride{display:flex;gap:12px;align-items:center;background:#fff;padding:14px;margin:9px 0;border-radius:14px;box-shadow:0 2px 9px #10243b0c}.ride-photo{width:94px;height:82px;flex:0 0 94px;border-radius:11px;object-fit:cover;background:#e8eef5}.photo-wrap{position:relative;flex:0 0 94px}.photo-credit{position:absolute;right:4px;bottom:4px;background:#ffffffde;border-radius:5px;padding:1px 4px;font-size:10px;color:#274463;text-decoration:none}.photo-placeholder{width:94px;height:82px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#d9eaf7,#edf0ff);font-size:30px}.detail{flex:1;min-width:0}@media(max-width:440px){.ride{gap:8px;padding:10px}.ride-photo,.photo-placeholder{width:76px;height:76px}.photo-wrap{flex-basis:76px}.wait{font-size:21px}.name{font-size:14px}.star{font-size:21px}}.name{font-weight:700}.area{font-size:12px;color:#6b7d90;margin-top:4px}.wait{font-size:25px;font-weight:800;color:#1262bc;white-space:nowrap}.wait small{font-size:12px;color:inherit}.wait.closed{font-size:14px;color:#7a8593}.star{border:0;color:#a4b0bf;font-size:24px;padding:4px}.star.on{color:#efaa21}.foot{font-size:12px;color:#65788d;line-height:1.7;margin:22px 2px}</style></head>
<body><header><h1>🏰 東京ディズニーランド 待ち時間</h1><small>個人用・1分ごとにデータを確認</small></header><main><div class="toolbar"><input id="search" placeholder="アトラクションを検索"><select id="sort"><option value="short">短い順</option><option value="long">長い順</option><option value="name">名前順</option></select><select id="area"><option value="">全エリア</option></select><button id="fav">☆ お気に入り</button><button id="reload">↻ 更新</button></div><div id="status" role="status">データを取得しています…</div><div id="rides"></div><p class="foot">データ提供：<a href="https://themeparks.wiki/">ThemeParks.wiki</a>。非公式の個人用ビューアです。写真：Wikimedia Commonsのライセンス確認済み画像（「出典」から詳細を確認できます）。写真が見つからない場合はアイコン表示です。待ち時間や運営状況には遅延・欠落があり得ます。正確な情報は東京ディズニーリゾート公式アプリでご確認ください。</p></main>

// Wikimedia Commonsの自由利用可能な写真を検索し、ライセンスを確認して表示します。
// 画像が見つからない場合はプレースホルダーを表示します。
const photoCache=new Map();
const PHOTO_API='https://commons.wikimedia.org/w/api.php';
function photoQuery(name){return 'Tokyo Disneyland '+name.replace(/[^a-zA-Z0-9 \\'-]/g,' ').trim()}
async function findPhoto(r){
  if(photoCache.has(r.id))return photoCache.get(r.id);
  const q=photoQuery(r.original);
  if(q.trim()==='Tokyo Disneyland')return null;
  const params=new URLSearchParams({action:'query',generator:'search',gsrsearch:'filetype:bitmap '+q,gsrnamespace:'6',gsrlimit:'8',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'240',format:'json',origin:'*'});
  try{
    const res=await fetch(PHOTO_API+'?'+params);
    if(!res.ok)throw Error('photo');
    const data=await res.json();
    const pages=Object.values(data.query?.pages||{});
    const found=pages.find(p=>{
      const info=p.imageinfo?.[0],meta=info?.extmetadata||{};
      const lic=String(meta.LicenseShortName?.value||'');
      return info?.thumburl && /^(CC0|CC BY|Public domain)/i.test(lic) && !/fair use/i.test(lic);
    });
    if(!found)return null;
    const info=found.imageinfo[0];
    const photo={url:info.thumburl,source:info.descriptionurl};
    photoCache.set(r.id,photo);return photo;
  }catch{return null}
}
async function fillPhotos(){
  const visible=rides.filter(r=>document.getElementById('photo-'+r.id));
  // リクエストが集中しないように順次取得
  for(const r of visible){
    const holder=document.getElementById('photo-'+r.id);
    if(!holder || holder.dataset.done)return;
    holder.dataset.done='1';
    const photo=await findPhoto(r);
    const target=document.getElementById('photo-'+r.id);
    if(!target||!photo)continue;
    const img=document.createElement('img');img.className='ride-photo';img.loading='lazy';img.alt=r.name+'の写真';img.src=photo.url;
    img.onerror=()=>{img.remove();target.querySelector('.photo-placeholder').hidden=false};
    target.querySelector('.photo-placeholder').hidden=true;target.appendChild(img);
    const link=document.createElement('a');link.className='photo-credit';link.href=photo.source;link.target='_blank';link.rel='noopener noreferrer';link.textContent='出典';link.title='写真・著作者・ライセンス情報';target.appendChild(link);
  }
}
const JP=Object.fromEntries(entries.map(([en,ja,area])=>[key(en),[ja,area]]));
const AREA={"World Bazaar":"ワールドバザール","Adventureland":"アドベンチャーランド","Westernland":"ウエスタンランド","Critter Country":"クリッターカントリー","Fantasyland":"ファンタジーランド","Toontown":"トゥーンタウン","Tomorrowland":"トゥモローランド"};
const $=id=>document.getElementById(id);let rides=[],onlyFav=false,lastFetch=0;
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('tdl-favs')||'[]')}catch{}const favs=new Set(Array.isArray(favorites)?favorites:[]);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLocaleLowerCase('ja'),a=$('area').value;let list=rides.filter(r=>(!onlyFav||favs.has(r.id))&&(!a||r.area===a)&&r.name.toLocaleLowerCase('ja').includes(q));const num=r=>r.wait===null?Infinity:r.wait;const mode=$('sort').value;list.sort((a,b)=>mode==='name'?a.name.localeCompare(b.name,'ja'):mode==='long'?(b.wait===null?-1:a.wait===null?1:b.wait-a.wait):(num(a)-num(b)));$('rides').innerHTML=list.length?list.map(r=>`<article class="ride"><button class="star ${favs.has(r.id)?'on':''}" data-id="${esc(r.id)}">${favs.has(r.id)?'★':'☆'}</button><div class="photo-wrap" id="photo-${esc(r.id)}"><div class="photo-placeholder" aria-label="写真を検索中">🏰</div></div><div class="detail"><div class="name">${esc(r.name)}</div><div class="area">${esc(r.area||'エリア情報なし')}</div></div><div class="wait ${r.wait===null?'closed':''}">${r.wait===null?esc(r.status):`${r.wait}<small> 分</small>`}</div></article>`).join(''):'<p>該当するアトラクションがありません。</p>';fillPhotos()}
function fillAreas(){const current=$('area').value,areas=[...new Set(rides.map(r=>r.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('area').innerHTML='<option value="">全エリア</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');$('area').value=areas.includes(current)?current:''}
async function load(force=false){if(!force&&Date.now()-lastFetch<60000)return;$('status').textContent='最新データを取得中…';try{const res=await fetch(BASE+PARK+'/live',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();rides=(data.liveData||[]).filter(x=>x.entityType==='ATTRACTION').map(x=>{const original=x.name||'名称不明';const translated=JP[key(original)];const standby=x.queue?.STANDBY;const wait=x.status==='OPERATING'&&typeof standby?.waitTime==='number'&&Number.isFinite(standby.waitTime)?standby.waitTime:null;const area=translated?.[1]||AREA[x.area?.name]||x.area?.name||'';const status={OPERATING:'待ち時間未掲載',DOWN:'一時休止',CLOSED:'運営終了',REFURBISHMENT:'休止中'}[x.status]||'情報なし';return{id:x.id,original,name:translated?.[0]||original,area,wait,status}});lastFetch=Date.now();fillAreas();render();$('status').textContent=`取得成功：${new Date().toLocaleTimeString('ja-JP')} ・ ${rides.length}件（提供元の更新頻度とは異なります）`;}catch(e){$('status').textContent='データ取得に失敗しました：'+e.message;if(!rides.length)$('rides').textContent='現在、待ち時間を表示できません。'}}
$('rides').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('tdl-favs',JSON.stringify([...favs]));render()});['search','sort','area'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('fav').onclick=()=>{onlyFav=!onlyFav;$('fav').classList.toggle('active',onlyFav);render()};$('reload').onclick=()=>load(true);load();setInterval(()=>load(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
