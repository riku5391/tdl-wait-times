<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243b"><title>TDL 待ち時間</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#15243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#10243b;color:white;padding:22px 16px 16px}h1{font-size:22px;margin:0 0 6px}.sub{font-size:12px;color:#c6d6ea}main{max-width:760px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select,button,input{font:inherit;border:1px solid #d5dfeb;border-radius:10px;padding:10px;background:white}button{cursor:pointer}.active{background:#176ad2;color:white}#status{font-size:13px;color:#52677f;margin:10px 0 15px;line-height:1.6}.ride{background:white;border-radius:14px;padding:14px;margin:9px 0;display:flex;align-items:center;gap:12px;box-shadow:0 2px 9px #10243b0c}.details{flex:1;min-width:0}.name{font-weight:700}.area{font-size:12px;color:#6b7d90;margin-top:4px}.wait{font-size:25px;font-weight:800;color:#1262bc;text-align:right;white-space:nowrap}.wait small{font-size:12px}.closed{font-size:14px;color:#7a8593;max-width:110px;white-space:normal}.star{font-size:24px;border:0;padding:4px;color:#a4b0bf}.star.on{color:#efaa21}.empty{padding:30px;text-align:center;color:#687b90}.foot{font-size:12px;color:#65788d;margin:20px 3px;line-height:1.6}</style></head>
<body><header><h1>🏰 東京ディズニーランド 待ち時間</h1><div class="sub">日本語表示・個人用ビューア</div></header><main><div class="toolbar"><input id="search" placeholder="アトラクションを検索" aria-label="検索" style="flex:1;min-width:140px"><select id="sort" aria-label="並び順"><option value="short">短い順</option><option value="long">長い順</option><option value="name">名前順</option></select><select id="area" aria-label="エリア"><option value="">全エリア</option></select><button id="fav">☆ お気に入り</button><button id="reload">↻ 更新</button></div><div id="status" role="status">データを取得しています…</div><div id="rides"></div><p class="foot">データ提供: <a href="https://themeparks.wiki/" target="_blank" rel="noopener">ThemeParks.wiki</a>。非公式アプリです。取得時刻は情報源の実更新時刻とは異なります。待ち時間や運営状況は公式アプリでも確認してください。</p></main>
<script>
const PARK='3cc919f1-d16d-43e0-8c3f-1dd269bd1a42',BASE='https://api.themeparks.wiki/v1/entity/';
const names={
'Beaver Brothers Explorer Canoes':'ビーバーブラザーズのカヌー探険','Tom Sawyer Island Rafts':'トムソーヤ島いかだ','Castle Carrousel':'キャッスルカルーセル',"Donald's Boat":'ドナルドのボート',"Mickey's PhilharMagic":'ミッキーのフィルハーマジック',"Westernland Shootin’ Gallery":'ウエスタンランド・シューティングギャラリー',"Westernland Shootin' Gallery":'ウエスタンランド・シューティングギャラリー',
'Big Thunder Mountain':'ビッグサンダー・マウンテン','Splash Mountain':'スプラッシュ・マウンテン','Space Mountain':'スペース・マウンテン',"Pooh's Hunny Hunt":'プーさんのハニーハント','Haunted Mansion':'ホーンテッドマンション','Pirates of the Caribbean':'カリブの海賊','Jungle Cruise: Wildlife Expeditions':'ジャングルクルーズ：ワイルドライフ・エクスペディション','Jungle Cruise':'ジャングルクルーズ','Western River Railroad':'ウエスタンリバー鉄道','Swiss Family Treehouse':'スイスファミリー・ツリーハウス','The Enchanted Tiki Room: Stitch Presents Aloha E Komo Mai!':'魅惑のチキルーム：スティッチ・プレゼンツ','The Enchanted Tiki Room':'魅惑のチキルーム',
'Country Bear Theater':'カントリーベア・シアター','Mark Twain Riverboat':'蒸気船マークトウェイン号','Peter Pan’s Flight':'ピーターパン空の旅',"Peter Pan's Flight":'ピーターパン空の旅','Snow White’s Adventures': '白雪姫と七人のこびと',"Snow White's Adventures":'白雪姫と七人のこびと','Pinocchio’s Daring Journey':'ピノキオの冒険旅行',"Pinocchio's Daring Journey":'ピノキオの冒険旅行','Dumbo the Flying Elephant':'空飛ぶダンボ',"Alice's Tea Party":'アリスのティーパーティー','Alice’s Tea Party':'アリスのティーパーティー','it’s a small world':'イッツ・ア・スモールワールド',"it's a small world":'イッツ・ア・スモールワールド','Cinderella’s Fairy Tale Hall':'シンデレラのフェアリーテイル・ホール',"Cinderella's Fairy Tale Hall":'シンデレラのフェアリーテイル・ホール',
'Enchanted Tale of Beauty and the Beast':'美女と野獣“魔法のものがたり”','The Happy Ride with Baymax':'ベイマックスのハッピーライド',"Monsters, Inc. Ride & Go Seek!":'モンスターズ・インク“ライド＆ゴーシーク！”','Star Tours: The Adventures Continue':'スター・ツアーズ：ザ・アドベンチャーズ・コンティニュー','Buzz Lightyear’s Astro Blasters':'バズ・ライトイヤーのアストロブラスター',"Buzz Lightyear's Astro Blasters":'バズ・ライトイヤーのアストロブラスター','Stitch Encounter':'スティッチ・エンカウンター','The Many Adventures of Winnie the Pooh':'プーさんのハニーハント',
'Roger Rabbit’s Car Toon Spin':'ロジャーラビットのカートゥーンスピン',"Roger Rabbit's Car Toon Spin":'ロジャーラビットのカートゥーンスピン','Gadget’s Go Coaster':'ガジェットのゴーコースター',"Gadget's Go Coaster":'ガジェットのゴーコースター',"Goofy's Paint 'n' Play House":'グーフィーのペイント＆プレイハウス','Chip ’n Dale’s Treehouse':'チップとデールのツリーハウス',"Chip 'n Dale's Treehouse":'チップとデールのツリーハウス',"Minnie's House":'ミニーの家','Toon Park':'トゥーンパーク',"Mickey's House and Meet Mickey":'ミッキーの家とミート・ミッキー',"Mickey's House and Meet Mickey Mouse":'ミッキーの家とミート・ミッキー','Omnibus':'オムニバス','Penny Arcade':'ペニーアーケード','World Bazaar':'ワールドバザール','The Disney Gallery':'ディズニーギャラリー'
};
const areas={'World Bazaar':'ワールドバザール','Adventureland':'アドベンチャーランド','Westernland':'ウエスタンランド','Critter Country':'クリッターカントリー','Fantasyland':'ファンタジーランド','Toontown':'トゥーンタウン','Tomorrowland':'トゥモローランド'};
let rides=[],onlyFav=false,lastFetch=0,loading=false;const $=id=>document.getElementById(id);let saved=[];try{saved=JSON.parse(localStorage.getItem('tdl-favs')||'[]')}catch(e){}const favs=new Set(Array.isArray(saved)?saved:[]);
function status(s){$('status').textContent=s}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalize(s){return String(s||'').replace(/[’‘]/g,"'").trim()}function jpName(s){return names[s]||names[normalize(s)]||s||'名称不明'}function jpArea(s){return areas[s]||s||'エリア不明'}
function render(){let q=$('search').value.trim().toLowerCase(),a=$('area').value;let list=rides.filter(r=>(!onlyFav||favs.has(r.id))&&(!a||r.area===a)&&r.name.toLowerCase().includes(q));let val=r=>r.wait===null?Infinity:r.wait;list.sort((a,b)=>{let mode=$('sort').value;if(mode==='name')return a.name.localeCompare(b.name,'ja');if(a.wait===null&&b.wait!==null)return 1;if(b.wait===null&&a.wait!==null)return -1;return mode==='long'?val(b)-val(a):val(a)-val(b)});$('rides').innerHTML=list.length?list.map(r=>`<article class="ride"><button class="star ${favs.has(r.id)?'on':''}" data-id="${esc(r.id)}" aria-label="お気に入り">${favs.has(r.id)?'★':'☆'}</button><div class="details"><div class="name">${esc(r.name)}</div><div class="area">${esc(r.area)}</div></div><div class="wait ${r.wait===null?'closed':''}">${r.wait===null?esc(r.status):`${r.wait}<small> 分</small>`}</div></article>`).join(''):'<div class="empty">該当するアトラクションがありません。</div>'}
function fillAreas(){let current=$('area').value;let options=[...new Set(rides.map(r=>r.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('area').innerHTML='<option value="">全エリア</option>'+options.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');$('area').value=options.includes(current)?current:''}
async function load(force=false){if(loading||(!force&&Date.now()-lastFetch<5*60*1000))return;loading=true;status('最新データを取得中…');try{const res=await fetch(BASE+PARK+'/live',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.liveData))throw Error('データ形式が不正です');const live=data.liveData;rides=live.filter(x=>x.entityType==='ATTRACTION').map(x=>{const st=x.queue?.STANDBY;const operating=x.status==='OPERATING';const wait=operating&&st?.status==='OPERATING'&&Number.isFinite(st.waitTime)&&st.waitTime>=0?st.waitTime:null;let label=operating?'待ち時間未掲載':x.status==='DOWN'?'一時休止':x.status==='CLOSED'?'運営終了':x.status==='REFURBISHMENT'?'休止中':'情報なし';return{id:x.id,name:jpName(x.name),area:jpArea(x.area?.name),wait,status:label}});lastFetch=Date.now();fillAreas();render();const known=rides.filter(x=>x.wait!==null).length;status(`取得成功：${new Date().toLocaleTimeString('ja-JP')} ／ ${rides.length}件（待ち時間あり ${known}件）。データ元の更新頻度は別です。`)}catch(e){status('取得失敗：'+e.message+'。通信状態やデータ提供元をご確認ください。');if(!rides.length)$('rides').innerHTML='<div class="empty">現在、待ち時間を表示できません。</div>'}finally{loading=false}}
$('rides').addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(!b)return;let id=b.dataset.id;favs.has(id)?favs.delete(id):favs.add(id);try{localStorage.setItem('tdl-favs',JSON.stringify([...favs]))}catch(e){}render()});['search','sort','area'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('fav').onclick=()=>{onlyFav=!onlyFav;$('fav').classList.toggle('active',onlyFav);render()};$('reload').onclick=()=>load(true);load();setInterval(()=>load(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
