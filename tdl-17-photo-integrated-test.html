['Star Tours – The Adventures Continue','スター・ツアーズ：ザ・アドベンチャーズ・コンティニュー','トゥモローランド'],

];
// 写真の自動検索は安全性と正確性が確認できるまで停止。
const AREA_ICON={'ファンタジーランド':'🏰','トゥモローランド':'🚀','ウエスタンランド':'🚂','アドベンチャーランド':'🌴','トゥーンタウン':'🎨','クリッターカントリー':'🌲','ワールドバザール':'🎠'};
const JP=Object.fromEntries(entries.map(([en,ja,area])=>[key(en),[ja,area]]));
const AREA={"World Bazaar":"ワールドバザール","Adventureland":"アドベンチャーランド","Westernland":"ウエスタンランド","Critter Country":"クリッターカントリー","Fantasyland":"ファンタジーランド","Toontown":"トゥーンタウン","Tomorrowland":"トゥモローランド"};
const $=id=>document.getElementById(id);let rides=[],onlyFav=false,lastFetch=0;
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('tdl-favs')||'[]')}catch{}const favs=new Set(Array.isArray(favorites)?favorites:[]);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const PHOTO_FILES = {"ビッグサンダー・マウンテン": "Tokyo Disneyland Big Thunder Mountain (53441792286).jpg", "スプラッシュ・マウンテン": "Splash Mountain, Tokyo Disneyland (9409908130).jpg", "プーさんのハニーハント": "Pooh's Hunny Hunt 1.jpg", "ホーンテッドマンション": "Haunted Mansion, Tokyo Disneyland (9407212583).jpg", "ベイマックスのハッピーライド": "Tokyo Disneyland The Happy Ride with Baymax (53440871047).jpg", "美女と野獣「魔法のものがたり」": "Tokyo Disneyland Enchanted Tale of Beauty and the Beast (53441935258).jpg", "イッツ・ア・スモールワールド": "Tokyo Disneyland It's a Small World (53440897752).jpg", "カリブの海賊": "Pirates of the Caribbean (Tokyo Disneyland) 1.jpg", "ジャングルクルーズ：ワイルドライフ・エクスペディション": "Jungle Cruise (Tokyo Disneyland) 1.jpg", "ジャングルクルーズ": "Jungle Cruise (Tokyo Disneyland) 1.jpg", "モンスターズ・インク“ライド＆ゴーシーク！”": "Monsters, Inc. Ride & Go Seek 1.jpg", "スター・ツアーズ：ザ・アドベンチャーズ・コンティニュー": "Tokyo Disneyland Star Tours The Adventures Continue (53440886397).jpg", "ミッキーのフィルハーマジック": "Tokyo Disneyland Mickey's PhilharMagic (53441962758).jpg", "ピノキオの冒険旅行": "Pinocchio's Daring Journey (Tokyo Disneyland) 1.jpg", "魅惑のチキルーム：スティッチ・プレゼンツ“アロハ・エ・コモ・マイ！”": "The Enchanted Tiki Room Stitch Presents Aloha E Komo Mai.jpg", "スイスファミリー・ツリーハウス": "Swiss Family Treehouse.jpg", "ウエスタンリバー鉄道": "Adventureland Station of the Western River Railroad in Tokyo Disneyland.png"};
function photoHTML(name){
 const file=PHOTO_FILES[name];
 if(!file)return '<div class="photo-placeholder" aria-label="写真未設定">📷</div>';
 const src='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+'?width=320';
 const page='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file);
 return '<a class="photo-source" href="'+page+'" target="_blank" rel="noopener" aria-label="'+esc(name)+'の写真の出典"><img class="ride-photo" src="'+src+'" alt="'+esc(name)+'の写真" loading="lazy" onerror="this.onerror=null;this.parentNode.textContent=\'📷\';this.parentNode.className=\'photo-placeholder\'"></a>';
}
function render(){const q=$('search').value.trim().toLocaleLowerCase('ja'),a=$('area').value;let list=rides.filter(r=>(!onlyFav||favs.has(r.id))&&(!a||r.area===a)&&r.name.toLocaleLowerCase('ja').includes(q));const num=r=>r.wait===null?Infinity:r.wait;const mode=$('sort').value;list.sort((a,b)=>mode==='name'?a.name.localeCompare(b.name,'ja'):mode==='long'?(b.wait===null?-1:a.wait===null?1:b.wait-a.wait):(num(a)-num(b)));$('rides').innerHTML=list.length?list.map(r=>`<article class="ride"><button class="star ${favs.has(r.id)?'on':''}" data-id="${esc(r.id)}">${favs.has(r.id)?'★':'☆'}</button>${photoHTML(r.name)}<div class="detail"><div class="name">${esc(r.name)}</div><div class="area">${esc(r.area||'エリア情報なし')}</div></div><div class="wait ${r.wait===null?'closed':''}">${r.wait===null?esc(r.status):`${r.wait}<small> 分</small>`}</div></article>`).join(''):'<p>該当するアトラクションがありません。</p>'}
function fillAreas(){const current=$('area').value,areas=[...new Set(rides.map(r=>r.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('area').innerHTML='<option value="">全エリア</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');$('area').value=areas.includes(current)?current:''}
async function load(force=false){if(!force&&Date.now()-lastFetch<60000)return;$('status').textContent='最新データを取得中…';try{const res=await fetch(BASE+PARK+'/live',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();rides=(data.liveData||[]).filter(x=>x.entityType==='ATTRACTION').map(x=>{const original=x.name||'名称不明';const translated=JP[key(original)];const standby=x.queue?.STANDBY;const wait=x.status==='OPERATING'&&typeof standby?.waitTime==='number'&&Number.isFinite(standby.waitTime)?standby.waitTime:null;const area=translated?.[1]||AREA[x.area?.name]||x.area?.name||'';const status={OPERATING:'待ち時間未掲載',DOWN:'一時休止',CLOSED:'運営終了',REFURBISHMENT:'休止中'}[x.status]||'情報なし';return{id:x.id,original,name:translated?.[0]||original,area,wait,status}});lastFetch=Date.now();fillAreas();render();$('status').textContent=`取得成功：${new Date().toLocaleTimeString('ja-JP')} ・ ${rides.length}件（提供元の更新頻度とは異なります）`;}catch(e){$('status').textContent='データ取得に失敗しました：'+e.message;if(!rides.length)$('rides').textContent='現在、待ち時間を表示できません。'}}
$('rides').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('tdl-favs',JSON.stringify([...favs]));render()});['search','sort','area'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('fav').onclick=()=>{onlyFav=!onlyFav;$('fav').classList.toggle('active',onlyFav);render()};$('reload').onclick=()=>load(true);load();setInterval(()=>load(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
